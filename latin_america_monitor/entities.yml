# 1b. REGION / BLOC TERMS  (count as the LatAm group "LATAM" ONLY in combination with a
#     foreign group => Tier 1; never Tier 2 on their own)
# =============================================================================
regional_terms:
  es: ["América Latina", "Latinoamérica", "Centroamérica", "Sudamérica", "Suramérica", "Hemisferio Occidental", "Cono Sur", "el Caribe"]
  pt: ["América Latina", "América Central", "América do Sul", "Hemisfério Ocidental", "Cone Sul"]
  en: ["Latin America", "Latin American", "Central America", "South America", "Western Hemisphere"]
  fr: ["Amérique latine", "Amérique centrale", "Amérique du Sud", "Hémisphère occidental"]
  case_sensitive: ["el Caribe"]
  notes: "'Caribe' alone is ambiguous (weather/cruise stories): only 'el Caribe' + a foreign group."

# =============================================================================
# 1c. DISPUTES / TOPIC ALIASES – one token that implies TWO groups (=> Tier 1 by itself unless weak)
# =============================================================================
disputes:
