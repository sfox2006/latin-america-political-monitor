  - {terms: ["Golfo de América", "Gulf of America", "Golfo de México", "Gulf of Mexico"], implies: [MX, US], weak: true, note: "Naming row; counts only with another signal."}
  - {terms: ["Canal de Panamá", "Panama Canal"], implies: [PA, US], weak: true, note: "US-Panama canal issue; weak because many canal headlines are domestic (drought, tolls)."}
  - {terms: ["Esequibo", "Essequibo", "Guayana Esequiba"], implies: [VE, GY], weak: false, note: "Venezuela-Guyana territorial dispute (ICJ)."}
  - {terms: ["salida al mar", "Silala"], implies: [BO, CL], weak: true, note: "Bolivia-Chile; 'salida al mar' can be used elsewhere."}
  - {terms: ["Guantánamo", "Guantanamo"], implies: [CU, US], weak: true, note: "Naval base (US-Cuba) vs detention camp (US domestic)."}
  - {terms: ["Escudo de las Américas", "Shield of the Americas", "Escudo das Américas"], implies: [US], weak: false, note: "US-led security alliance (2026); also listed under institutions."}

