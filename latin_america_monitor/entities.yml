# =============================================================================
# 5. EXPLICIT TIER RULES (implementation spec)
# =============================================================================
tier_rules:
  group_resolution: >
    Each matched alias resolves to (group, kind). Group = LatAm country code (20 + PR), 'LATAM' (regional term),
    or a foreign group id (US, CN, EU, UK, ... or an institution id). A leader/metonym/demonym resolves to its
    country's group. Institutions with `group: US` (SOUTHCOM, DEA, USAID, US_AGENCIES, SHIELD) resolve to US.
    `implies_country` (e.g. John Barrett -> VE), `disputes.implies` and `USMCA.implies` add extra groups.
  tier_1: "at least one LatAm country group AND at least one OTHER group (foreign country/leader/institution, or a second LatAm country). LATAM counts as a LatAm group only together with a foreign group."
  tier_2: "exactly one LatAm country group and no other group, plus >=1 strong ir_term (or >=2 distinct weak terms when the LatAm match is a country NAME)."
  drop: "everything else (single LatAm group with no strong IR term; foreign-only headlines; no entities)."
  weak_entities: "A weak alias only counts if at least one non-weak entity of a DIFFERENT group is also present."
  dedupe: "Country + its own leader + its own demonym = ONE group (e.g. 'Kast ... Chile' is not Tier 1)."
  puerto_rico: "PR+US only reaches Tier 1/2 with a strong ir_term; otherwise drop (federal/domestic)."
  publisher_names: "Masked via out_of_entity_names before matching; the `publisher` field is never matched."
  second_latam_country: "A second LatAm group makes Tier 1 even if it appears as a demonym ('Venezolanos ... Colombia')."

# Recall net for GDELT, which searches the English machine translation and rejects
# long queries. This is narrower than the headline aliases above. Leader tokens are
# omitted for the outlet's own country so a domestic story is not requested.
# Exact token "sanciona" is not an IR term (it means "signs a law"); see the matcher.
gdelt:
  terms:
    - sanctions
    - tariff
    - tariffs
    - visa
    - visas
    - ambassador
    - diplomatic
    - treaty
    - extradition
    - deportation
    - summit
    - OAS
    - IMF
    - CELAC
    - Mercosur
    - BRICS
    - NATO
    - embargo
    - bilateral
    - China
    - Russia
    - France
    - Germany
    - Spain
    - Iran
    - Israel
    - Ukraine
    - EU
    - "United States"
    - "United Kingdom"
    - "United Nations"
    - "European Union"
  leaders:
    AR: [Milei]
    BR: [Lula]
    US: [Trump, Rubio]
    RU: [Putin]
  regional:
    - "Latin America"
  # Legislative verb. The wildcard sancion* still matches sanciones / sancionan / sanctions.
  not_ir_tokens:
    - sanciona
