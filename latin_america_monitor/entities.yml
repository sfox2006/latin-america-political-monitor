# =============================================================================
# 4. IR TERMS (Tier 2).  Tier 2 = exactly one LatAm group + >=1 `strong` term
#    (or >=2 distinct `weak` terms when the LatAm entity is a country NAME, not a metonym/person).
#    Matching is on accent-folded text. "*" = prefix wildcard ("sancion*" -> sanción/sanciones/sancionar).
#    Multi-word entries are phrase matches; "|" inside parentheses is alternation (regex-lite).
#    Strong terms are chosen so that their domestic false-positive rate is low; anything ambiguous lives in `weak`.
# =============================================================================
