# Countries, leaders, and international-relations terms for headline filtering.
# Matching is accent- and case-insensitive, with word boundaries. Short
# abbreviations that are also everyday words (EU/UE, US, UN, UK) are listed
# under abbreviations and are matched only as uppercase tokens, plus a few
# safe phrases such as "la ue".
#
# verified: false means the office is not confirmed. LAPM Sources is checking
# leaders separately; correct this file rather than the matcher.
#
# Georgia is masked (stop_phrases) because the US state and the country share
# the bare name. Nuevo México / New Mexico and the Panama Papers are masked
# so they do not count as Mexico or Panama.

stop_phrases:
  - "Nuevo México"
  - "New Mexico"
  - "New Mexican"
  - "Nuevo mexicano"
  - "Panama Papers"
  - "Papeles de Panamá"
  - "Georgia"

# English tokens folded into GDELT queries. Headline matching does not read this
# list; it is the recall net for the index, which searches machine-translated
# English. Keep it narrower than the headline aliases.
# High-signal English tokens for the GDELT recall net. This is intentionally
# narrower than the headline aliases: the index query has a hard length cap,
# and a wider list multiplies into hundreds of extra requests. Headline
# matching still understands the full alias lists below.
gdelt_terms:
  - sanctions
  - tariff
  - tariffs
  - visa
  - visas
  - ambassador
  - diplomatic
  - treaty
  - extradition
  - deportation
  - summit
  - OAS
  - IMF
  - CELAC
  - Mercosur
  - BRICS
  - NATO
  - embargo
  - bilateral
  - China
  - Russia
  - France
  - Germany
  - Spain
  - Iran
  - Israel
  - Ukraine
  - EU
  - "United States"
  - "United Kingdom"
  - "United Nations"
  - "European Union"

# Pan-regional phrases. They satisfy "a Latin American entity" but do not pair
# with a specific country to make Tier 1, and they are not a home market.
regional:
  display: "AMÉRICA LATINA"
  region: americas
  gdelt:
    - "Latin America"
  aliases:
    - "Latin America"
    - "América Latina"
    - "America Latina"
    - Latinoamérica
    - Latinoamerica
    - Latam
    - "South America"
    - Sudamérica
    - Sudamerica
    - "América del Sur"
    - "Central America"
    - Centroamérica
    - Centroamerica
    - "América Central"
    - Caribe
    - Caribbean
    - "the Caribbean"

