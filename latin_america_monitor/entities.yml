# =============================================================================
# LAPM – International-Relations headline filter: entity configuration
# As-of date for all office-holders: 2026-09-30.  Generated 2026-09-30 (America/New_York).
# Office-holder facts were verified by web search on 2026-09-30; sources and any
# UNVERIFIED items are listed in leaders_verification.md (same folder).
#
# MATCHING RULES (implemented by the reference checker check_entities.py):
#   * Match on HEADLINE TEXT ONLY (no body, no URL, no publisher name).
#   * Normalisation: Unicode NFKD, strip combining marks (accent-insensitive),
#     casefold, collapse whitespace/punctuation (so "EE. UU." == "ee uu" == "EEUU" via explicit aliases).
#     Aliases listed here keep their natural accents for readability; they are folded at load time.
#   * Word boundaries: every alias is matched as a whole token sequence unless it carries a
#     trailing "*" (prefix wildcard, e.g. "sancion*" -> sanción/sanciones/sancionar).
#   * case_sensitive aliases are matched BEFORE casefolding against the original text
#     (needed for EU/UE, US, UN, CAN, BID, CPI, RD, Maduro, Rubio ...).
#   * weak aliases never trigger on their own; they only count if another (non-weak) entity
#     from a DIFFERENT group is also present in the same headline.
#   * stoplist_phrases are masked out of the headline before matching (global_stoplist_phrases too).
#   * Headline language (es/pt/en/fr) is detected first; `lang_only` restricts an alias to those languages.
#
# TIERS:
#   Tier 1 = >=1 LatAm entity AND >=1 DIFFERENT entity: a foreign country/leader/institution,
#            or a second LatAm country/leader.
#   Tier 2 = exactly one LatAm country (leader + own country collapse to ONE) AND >=1 strong ir_term.
#   Else DROP (domestic).
#   "Collapse": a leader/figure counts as the country they belong to (Kast + Chile = 1 entity).
#   Foreign officials with `implies_country` (e.g. US chargé John Barrett -> VE) also count as that LatAm entity.
#   Special case: Puerto Rico + United States never yields Tier 1 on its own (PR-US is federal/domestic);
#   it needs an additional ir_term (see puerto_rico_us_rule).
# =============================================================================

meta:
  version: 1
  as_of: "2026-09-30"
  languages: [es, pt, en, fr]
  accent_insensitive: true
  headline_only: true
  all_caps_headline_fix: true   # if >70% of letters are uppercase, title-case the headline BEFORE case-sensitive checks
  puerto_rico_us_rule: require_ir_term   # PR + US => Tier 2 only if a strong ir_term is present
  case_sensitive_note: >
    Spanish/Portuguese press uses "EU" for Estados Unidos (Proceso, El Universal) while English
    "EU" is the European Union; "UE" is Unión Europea. Handled in foreign_entities via lang_only.

regions:
  "Norteamérica": [MX]
  "Centroamérica + Caribe": [GT, HN, SV, NI, CR, PA, CU, DO, HT, PR]
  "Sudamérica": [AR, BO, BR, CL, CO, EC, PY, PE, UY, VE]

# Words that must never be matched as entities anywhere (applied to the whole headline first).
global_stoplist_phrases:
  - "Nuevo México"            # US state (also New Mexico / Nouveau-Mexique / Novo México)
  - "New Mexico"
  - "Nouveau-Mexique"
  - "Novo México"
  - "Ciudad de México"        # city-level news is domestic; remove if capital-level diplomacy matters
  - "Mexico City"
  - "Cidade do México"
  - "Guinea Ecuatorial"       # Equatorial Guinea (not Ecuador)
  - "Equatorial Guinea"
  - "Guinée équatoriale"
  - "Guiné Equatorial"
  - "Papúa Nueva Guinea"
  - "Papua New Guinea"
  - "Guinea-Bisáu"
  - "Guinea Bissau"
  - "Guinea"                  # bare Guinea is never a target entity
  - "Georgia"                 # US state / Caucasus: not in scope, avoids Georgia-vs-"George..." noise
  - "Colombia Británica"      # British Columbia (Canada)
  - "British Columbia"
  - "Colombie-Britannique"
  - "Colômbia Britânica"
  - "Distrito de Columbia"
  - "District of Columbia"
  - "Washington Post"
  - "Washington Commanders"
  - "Estado de Washington"
  - "Washington State"
  - "George Washington"
  - "Panama Papers"           # DECISION: stoplisted (2016 leak/trial coverage, not Panama-the-state). Re-enable case by case.
  - "Papeles de Panamá"
  - "Papéis do Panamá"
  - "Panama City Beach"
  - "chile con carne"
  - "chili con carne"
  - "chile relleno"
  - "chile en nogada"
  - "chiles en nogada"
  - "Ronda Uruguay"
  - "Uruguay Round"
  - "Orden Dominicana"
  - "Dominican Order"
  - "Brasil de Fato"           # media outlet name, not the state
  - "Brasil Paralelo"
  - "Miss Universo"           # beauty contest noise (Miss Venezuela/Miss Colombia ...)
  - "Miss Universe"
  - "Copa América"
  - "Copa Libertadores"
  - "Copa Sudamericana"
  - "Copa del Mundo"
  - "Mundial de Fútbol"
  - "World Cup"
  - "Selección de"            # sports team headlines ("Selección de Colombia ...")
  - "Seleção"
  - "Liga de Campeones"

# Sports/culture are out of scope. The matcher drops a headline that contains any of
# these (word boundaries, accent-insensitive) before entity matching. Bare "partido"
# is omitted on purpose: in Spanish it is also a political party.
out_of_scope_hint_terms:
  es: ["fútbol", "futbol", "gol", "goleada", "goles", "campeonato", "mundial sub", "telenovela", "farándula", "horóscopo", "copa", "eliminatorias", "selección", "derrota a"]
  pt: ["futebol", "gol", "goleada", "gols", "campeonato", "novela", "horóscopo", "copa", "eliminatórias", "seleção", "derrota a"]
  en: ["football match", "soccer", "box office", "horoscope", "world cup qualifier"]
  fr: ["football", "match de", "horoscope", "éliminatoires"]

