name: Weekday Latin America Political Monitor

on:
  schedule:
    # 11:00 UTC, Monday-Friday. Monday automatically covers the prior 72 hours.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Optional lookback override (blank uses Monday=72, other days=24)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: latin-america-political-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MONITOR_TIMEZONE: ${{ vars.MONITOR_TIMEZONE || 'America/New_York' }}
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || '5.25' }}
          ENRICH_HEADLINES: ${{ vars.ENRICH_HEADLINES || 'false' }}
          LOOKBACK: ${{ inputs.lookback_hours }}
        run: |
          if [ -n "$LOOKBACK" ]; then
            python main.py --lookback-hours "$LOOKBACK"
          else
            python main.py
          fi
      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latin-america-political-monitor-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
