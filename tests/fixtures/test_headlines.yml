borderline:
- id: T01
  headline: 'EU investiga a Andy López Beltrán por crimen organizado y huachicol: NYT'
  publisher: Proceso
  current_label: 1
  question_for_sam: 'US agencies analysing allegations against a Mexican politician (no formal probe per NYT): decide if ''US investigates Mexican politician'' counts as IR.'
- id: T07
  headline: '“Posibles terroristas”: el vocero presidencial habló de las declaraciones de Milei sobre los extranjeros expulsados'
  publisher: La Nación
  current_label: 2
  question_for_sam: Expulsion of foreigners is domestic immigration policy unless a specific country is named; matches only via the 'expuls*' term.
- id: T13
  headline: Estados Unidos lanza una nueva ofensiva contra jueces, fiscales, empresarios y políticos de América Latina
  publisher: El País
  current_label: 1
  question_for_sam: Filed under BOLIVIA in the source but the headline is region-wide and names no country; matches only through the LATAM regional term. Decide whether region-wide items are wanted.
- id: T15
  headline: Can Venezuela’s Push for Elections Succeed?
  publisher: Americas Quarterly
  current_label: drop
  question_for_sam: Sam's briefing kept it; headline gives no foreign actor. Drop under the headline-only rule, or whitelist by publisher/topic?
- id: T18
  headline: EU tira producción de autos eléctricos en México
  publisher: El Universal
  current_label: 1
  question_for_sam: Probably US automakers cutting EV output in Mexico - corporate/economic, not state-to-state. 'EU' also reads as European Union outside Spanish-press convention.
- id: T20
  headline: A Red Flag in Mexico’s Democratic Backsliding- A new law could annul election results in cases of “foreign interference,” handing the ruling party a powerful tool.
  publisher: Americas Quarterly
  current_label: 2
  question_for_sam: 'Domestic law about foreign interference: IR-adjacent only through the term; no foreign actor named.'
- id: T23
  headline: Caravana de más de 600 migrantes, incluidos hondureños, reanuda su camino hacia la frontera de México con EEUU
  publisher: El Heraldo
  current_label: 1
  question_for_sam: 'Migrant caravan: governments are not acting in the headline. By the entity rule it is Tier 1; by the ''how a country deals with another'' test it is not.'
- id: T35
  headline: Durante años, Estados Unidos persiguió a los capos de la droga de México. Ahora, tiene en la mira a los políticos
  publisher: CNN Español
  current_label: 1
  question_for_sam: 'US law enforcement targeting Mexican politicians: Tier 1 by entities; Sam''s ''DEA/US investigates Mexican politician'' borderline.'
- id: T37
  headline: Díaz-Canel asegura que Cuba es víctima de un "genocidio fríamente calculado"
  publisher: Infobae
  current_label: drop
  question_for_sam: Implicitly about the US embargo, but the headline is single-entity with no IR term; drops under the headline-only rule.
